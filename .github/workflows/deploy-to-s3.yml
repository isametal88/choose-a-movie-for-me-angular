name: Build and deploy to S3

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build (production)
        run: npm run build -- --configuration production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Sync build to S3
        env:
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Path from angular.json: dist/choose-a-movie-for-me-angular/browser
          BUILD_DIR="dist/choose-a-movie-for-me-angular/browser"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Build output not found: $BUILD_DIR"
            exit 1
          fi
          aws s3 sync "$BUILD_DIR" "s3://$S3_BUCKET" \
            --region "$AWS_REGION" \
            --delete \
            --exact-timestamps

          # Configure the bucket as a static website so SPA routes resolve to index.html
          # This sets index and error document to index.html (SPA fallback).
          aws s3 website "s3://$S3_BUCKET" --index-document index.html --error-document index.html || true

